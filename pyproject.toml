[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabing"
version = "0.1.0"
description = "arabing (Arabic + string) is a Python library that extends the standard `string` module with full character-set support for languages written in **Arabic-derived scripts** — Arabic, Persian, Urdu, Pashto, Kurdish, Sindhi, Uyghur, Kashmiri, and Punjabi (Shahmukhi)."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Abbas Safardoost", email = "a.safardoust@gmail.com" }
]
keywords = ["arabic", "persian", "urdu", "quran", "string", "unicode", "nlp", "emoji"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Arabic",
    "Natural Language :: Persian",
    "Natural Language :: Urdu",
]
dependencies = [
    "regex>=2021.11.10",
]

[project.urls]
Homepage = "https://github.com/asdoost/arabing"
Repository = "https://github.com/asdoost/arabing"
Issues = "https://github.com/asdoost/arabing/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]